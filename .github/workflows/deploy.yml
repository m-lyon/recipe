name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'
      - 'dev-docs/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its in-flight run; runs on main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REMOTE_USER: deploy-recipe
  API_TARGET: /srv/recipe/
  CLIENT_TARGET: /var/www/recipes/
  PUBLIC_URL: https://recipes.mattlyon.co.uk

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json
            cli/package-lock.json

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: ${{ vars.MONGODB_VERSION }}

      - name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Install CLI dependencies
        working-directory: ./cli
        run: npm ci

      - name: Create API environment file
        working-directory: ./api
        run: |
          echo "MONGODB_URI = ${{ vars.MONGODB_URI }}" > .env.test.local
          echo "MONGODB_VERSION = ${{ vars.MONGODB_VERSION }}" >> .env.test.local
          echo "PORT = ${{ vars.PORT }}" >> .env.test.local
          echo "SESSION_SECRET = ${{ secrets.SESSION_SECRET }}" >> .env.test.local
          echo "SESSION_URI = ${{ secrets.SESSION_URI }}" >> .env.test.local
          echo "WHITELISTED_DOMAINS = ${{ secrets.WHITELISTED_DOMAINS }}" >> .env.test.local

      - name: Create client environment file
        working-directory: ./client
        run: |
          echo "VITE_GRAPHQL_URL = ${{ vars.VITE_GRAPHQL_URL }}" > .env.test.local
          echo "VITE_ROOT_PATH = ${{ vars.VITE_ROOT_PATH }}" >> .env.test.local
          echo "VITE_DELAY_SHORT = ${{ vars.VITE_DELAY_SHORT }}" >> .env.test.local
          echo "VITE_DELAY_LONG = ${{ vars.VITE_DELAY_LONG }}" >> .env.test.local
          echo "VITE_DEBUG = ${{ vars.VITE_DEBUG }}" >> .env.test.local
          echo "VITE_DEBOUNCE_TIME = ${{ vars.VITE_DEBOUNCE_TIME }}" >> .env.test.local
          echo "VITE_INIT_LOAD_NUM = ${{ vars.VITE_INIT_LOAD_NUM }}" >> .env.test.local
          echo "VITE_FETCH_MORE_NUM = ${{ vars.VITE_FETCH_MORE_NUM }}" >> .env.test.local

      - name: Create CLI environment file
        working-directory: ./cli
        run: |
          echo "RECIPE_API_URL = ${{ vars.VITE_GRAPHQL_URL }}" > .env.test.local
          echo "RECIPE_USERNAME = ${{ vars.TEST_USERNAME }}" >> .env.test.local
          echo "RECIPE_PASSWORD = ${{ vars.TEST_PASSWORD }}" >> .env.test.local

      - name: Load MongoDB binary cache
        id: cache-mongodb-binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-${{ vars.MONGODB_VERSION }}

      - name: Download MongoDB Memory Server
        working-directory: ./api
        run: npm run dl_memory

      - name: Start server in development mode
        working-directory: ./api
        run: NODE_ENV=test npm run start &

      - name: Wait for server start
        run: sleep 3s

      - name: Generate GraphQL types
        working-directory: ./client
        run: npm run generate:test

      - name: Generate CLI GraphQL types
        working-directory: ./cli
        run: npm run generate:test

      # Cheap checks first, so formatting and type errors fail within a couple of minutes
      - name: Lint client
        working-directory: ./client
        run: npm run lint

      - name: Type-check client
        working-directory: ./client
        run: npm run check-types

      - name: Lint CLI
        working-directory: ./cli
        run: npm run lint

      - name: Run API tests
        working-directory: ./api
        run: npm run start:test

      - name: Test client
        working-directory: ./client
        run: npm run test -- run

      - name: Build CLI
        working-directory: ./cli
        run: npm run build

      - name: Test CLI
        working-directory: ./cli
        run: npm run start:test

      # NOTE: disabling browser tests for now due to issues
      # with latest version of @vitest/browser
      # - name: Install Playwright Browsers
      #   working-directory: ./client
      #   run: npx playwright install --with-deps

      # - name: Test client in browser mode
      #   working-directory: ./client
      #   run: npm run test:browser -- run

      - name: Upload GraphQL types
        uses: actions/upload-artifact@v4
        with:
          name: graphql-types
          path: ./client/src/__generated__/

  deploy:
    runs-on: ubuntu-22.04 # matches the server
    environment: production
    needs: test
    # PRs only run the tests; deploys come from main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # One group for the deploy target, so two runs never touch the server at once
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the Tailscale action authenticate with GitHub's OIDC token
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Compile API
        working-directory: ./api
        run: |
          npm ci
          npm run prod:compile
          npm prune --omit=dev
          cp ../.nvmrc .nvmrc

      - name: Create client environment file
        working-directory: ./client
        run: |
          echo "VITE_DEBOUNCE_TIME = ${{ vars.VITE_DEBOUNCE_TIME }}" > .env.production.local
          echo "VITE_DELAY_LONG = ${{ vars.VITE_DELAY_LONG }}" >> .env.production.local
          echo "VITE_DELAY_SHORT = ${{ vars.VITE_DELAY_SHORT }}" >> .env.production.local
          echo "VITE_FETCH_MORE_NUM = ${{ vars.VITE_FETCH_MORE_NUM }}" >> .env.production.local
          echo "VITE_INIT_LOAD_NUM = ${{ vars.VITE_INIT_LOAD_NUM }}" >> .env.production.local
          echo "VITE_LOGIN_ENDPOINT = ${{ vars.VITE_LOGIN_ENDPOINT }}" >> .env.production.local

      - name: Download GraphQL types
        uses: actions/download-artifact@v4
        with:
          name: graphql-types
          path: ./client/src/__generated__/

      # Served from the root of recipes.mattlyon.co.uk, with the API on the same origin at /api/
      - name: Compile client
        working-directory: ./client
        env:
          VITE_GRAPHQL_URL: /api/
          VITE_ROOT_PATH: ''
        run: |
          npm ci
          npm run build

      # The server has no public SSH. The runner joins the tailnet as an
      # ephemeral tag:ci node, which the tailnet policy lets reach only
      # the server's SSH port.
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.REMOTE_HOST }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
              HostName $REMOTE_HOST
              Port $REMOTE_PORT
              User ${{ env.REMOTE_USER }}
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              StrictHostKeyChecking yes
          EOF

      - name: Check server has the pinned Node version
        run: |
          v=$(cat .nvmrc)
          ssh deploy-target test -x "/usr/local/nvm/versions/node/$v/bin/node" || {
              echo "::error::Node $v is not installed on the server. As root: NVM_DIR=/usr/local/nvm bash -c '. /usr/local/nvm/nvm.sh && nvm install $v'"
              exit 1
          }

      - name: Deploy API
        run: >
          rsync -rlpt --delete --chmod=D2750,F0640
          --include='/dist/***' --include='/node_modules/***'
          --include='/package.json' --include='/package-lock.json' --include='/.nvmrc'
          --exclude='*'
          ./api/ deploy-target:${{ env.API_TARGET }}

      - name: Deploy client
        run: rsync -rlpt --delete --chmod=D755,F644 ./client/dist/ deploy-target:${{ env.CLIENT_TARGET }}

      - name: Restart API
        run: ssh deploy-target sudo -n /usr/bin/systemctl restart recipe.service

      - name: Health check
        run: |
          for i in $(seq 1 12); do
              sleep 5
              page=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/")
              api=$(curl -s -X POST -H 'Content-Type: application/json' \
                  --data '{"query":"{ __typename }"}' "$PUBLIC_URL/api/" || true)
              echo "attempt $i: page $page, api $api"
              [ "$page" = 200 ] && printf '%s' "$api" | jq -e '.data.__typename == "Query"' >/dev/null && exit 0
          done
          exit 1
