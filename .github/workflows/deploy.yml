name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its in-flight run; runs on main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REMOTE_USER: deploy-recipe
  API_TARGET: /srv/recipe/
  CLIENT_TARGET: /var/www/recipes/
  PUBLIC_URL: https://recipes.mattlyon.co.uk

jobs:
  # lint and test are both required to pass before a PR can merge into main (ruleset, branch
  # must be up to date), so main is not re-tested on push.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - &checkout-code
        name: Checkout code
        uses: actions/checkout@v7

      - &setup-node-all
        name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json
            cli/package-lock.json

      - &install-api-deps
        name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - &install-client-deps
        name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - &install-cli-deps
        name: Install CLI dependencies
        working-directory: ./cli
        run: npm ci

      # Linting doesn't need the generated GraphQL types, so no API or codegen here
      - name: Lint API
        working-directory: ./api
        run: npm run lint

      - name: Lint client
        working-directory: ./client
        run: npm run lint

      - name: Lint CLI
        working-directory: ./cli
        run: npm run lint

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    env:
      MONGODB_VERSION: ${{ vars.MONGODB_VERSION }}
    steps:
      - *checkout-code

      - *setup-node-all

      - *install-api-deps

      - *install-client-deps

      - *install-cli-deps

      - name: Create client environment file
        working-directory: ./client
        run: |
          echo "VITE_GRAPHQL_URL = ${{ vars.VITE_GRAPHQL_URL }}" > .env.test.local
          echo "VITE_ROOT_PATH = ${{ vars.VITE_ROOT_PATH }}" >> .env.test.local
          echo "VITE_DELAY_SHORT = ${{ vars.VITE_DELAY_SHORT }}" >> .env.test.local
          echo "VITE_DELAY_LONG = ${{ vars.VITE_DELAY_LONG }}" >> .env.test.local
          echo "VITE_DEBUG = ${{ vars.VITE_DEBUG }}" >> .env.test.local
          echo "VITE_DEBOUNCE_TIME = ${{ vars.VITE_DEBOUNCE_TIME }}" >> .env.test.local
          echo "VITE_INIT_LOAD_NUM = ${{ vars.VITE_INIT_LOAD_NUM }}" >> .env.test.local
          echo "VITE_FETCH_MORE_NUM = ${{ vars.VITE_FETCH_MORE_NUM }}" >> .env.test.local

      - name: Load MongoDB binary cache
        id: cache-mongodb-binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-${{ vars.MONGODB_VERSION }}

      - name: Download MongoDB Memory Server
        working-directory: ./api
        run: npm run dl_memory

      - name: Check committed GraphQL schema is up to date
        working-directory: ./api
        run: |
          npm run print-schema
          git diff --exit-code -- schema.graphql || {
              echo "::error::api/schema.graphql is stale. Run 'npm run print-schema' in api/ and commit it."
              exit 1
          }

      - name: Generate client GraphQL types
        working-directory: ./client
        run: npm run generate

      - name: Generate CLI GraphQL types
        working-directory: ./cli
        run: npm run generate

      - name: Type-check client
        working-directory: ./client
        run: npm run check-types

      - name: Run API tests
        working-directory: ./api
        run: npm run start:test

      - name: Test client
        working-directory: ./client
        run: npm run test -- run

      - name: Build CLI
        working-directory: ./cli
        run: npm run build

      - name: Test CLI
        working-directory: ./cli
        run: npm run start:test

      - name: Install Playwright Firefox
        working-directory: ./client
        run: npx playwright install --with-deps firefox

      - name: Test client in browser mode
        working-directory: ./client
        run: npm run test:browser -- run

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04 # matches the server
    steps:
      - *checkout-code

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json

      - *install-api-deps

      - *install-client-deps

      # From the committed api/schema.graphql, which the test job checked is up to date
      - name: Generate GraphQL types
        working-directory: ./client
        run: npm run generate

      - name: Build client
        working-directory: ./client
        env:
          VITE_GRAPHQL_URL: /api/
          VITE_ROOT_PATH: ''
        run: npm run build

      - name: Build API
        working-directory: ./api
        run: |
          rm -rf dist
          npm run prod:compile
          npm prune --omit=dev
          cp ../.nvmrc .nvmrc
          # tar keeps node_modules symlinks and modes intact through the artifact
          tar czf ../api.tgz dist node_modules package.json package-lock.json .nvmrc

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            api.tgz
            client/dist/
          retention-days: 7

  # Ships the build. Holds the production secrets but runs no npm installs or project code.
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment: production
    # One group for the deploy target, so two runs never touch the server at once
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the Tailscale action authenticate with GitHub's OIDC token
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Unpack API
        run: mkdir api && tar xzf api.tgz -C api

      # The server has no public SSH. The runner joins the tailnet as an
      # ephemeral tag:ci node, which the tailnet policy lets reach only
      # the server's SSH port.
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.REMOTE_HOST }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
              HostName $REMOTE_HOST
              Port $REMOTE_PORT
              User ${{ env.REMOTE_USER }}
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              StrictHostKeyChecking yes
          EOF

      - name: Check server has the pinned Node version
        run: |
          v=$(cat api/.nvmrc)
          ssh deploy-target test -x "/usr/local/nvm/versions/node/$v/bin/node" || {
              echo "::error::Node $v is not installed on the server. As root: NVM_DIR=/usr/local/nvm bash -c '. /usr/local/nvm/nvm.sh && nvm install $v'"
              exit 1
          }

      - name: Deploy API
        run: rsync -rlpt --delete --chmod=D2750,F0640 ./api/ deploy-target:${{ env.API_TARGET }}

      - name: Deploy client
        run: rsync -rlpt --delete --chmod=D755,F644 ./client/dist/ deploy-target:${{ env.CLIENT_TARGET }}

      - name: Restart API
        run: ssh deploy-target sudo -n /usr/bin/systemctl restart recipe.service

      - name: Health check
        run: |
          for i in $(seq 1 12); do
              sleep 5
              page=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/")
              api=$(curl -s -X POST -H 'Content-Type: application/json' \
                  --data '{"query":"{ __typename }"}' "$PUBLIC_URL/api/" || true)
              echo "attempt $i: page $page, api $api"
              [ "$page" = 200 ] && printf '%s' "$api" | jq -e '.data.__typename == "Query"' >/dev/null && exit 0
          done
          exit 1
